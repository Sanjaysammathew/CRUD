<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow | Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../style/register.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <button class="btn btn-outline-secondary theme-toggle" id="themeToggler">
    <i class="bi bi-sun-fill" id="themeIcon"></i>
  </button>

  <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-2">
        <i class="bi bi-intersect"></i>
      </div>
      <span class="brand-title">Taskflow</span>
    </div>

    <!-- Register Card -->
    <div class="card register-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <h3 class="fw-bold mb-1">Create Account</h3>
          <p class="text-muted small">Please fill in your details to get started.</p>
        </div>

        <form id="register-form" novalidate>

          <!-- Username -->
          <div class="mb-3">
            <div class="form-floating">
              <input type="text" class="form-control" id="userInput" placeholder="Username">
              <label for="userInput">Username</label>
            </div>
            <div id="invalid-username" class="text-danger small mt-1"></div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <div class="form-floating">
              <input type="text" class="form-control" id="emailInput" placeholder="name@example.com">
              <label for="emailInput">Email address</label>
            </div>
            <div id="invalid-email" class="text-danger small mt-1"></div>
          </div>

          <!-- Password & Confirm -->
          <div class="row g-2">
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="password" class="form-control" id="passInput" placeholder="Password">
                <label for="passInput">Password</label>
              </div>
              <div id="invalid-password" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="form-floating">
                <input type="password" class="form-control" id="confirmInput" placeholder="Confirm">
                <label for="confirmInput">Confirm</label>
              </div>
              <div id="invalid-confirm" class="text-danger small mt-1"></div>
            </div>
          </div>

          <!-- Phone Number -->
          <div class="mb-3">
            <div class="form-floating">
              <input type="number" class="form-control" id="num" placeholder="Phone Number">
              <label for="num">Phone Number</label>
            </div>
            <div id="invalid-number" class="text-danger small mt-1"></div>
          </div>

          <!-- Birth Date -->
          <div class="mb-3">
            <div class="form-floating">
              <input type="date" class="form-control" id="dateInput">
              <label for="dateInput">Birth Date</label>
            </div>
            <div id="invalid-date" class="text-danger small mt-1"></div>
          </div>

          <!-- Gender -->
          <div class="mb-3">
            <label class="form-label text-muted small d-block mb-2">Gender</label>
            <div class="d-flex gap-4">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                <label class="form-check-label" for="male">Male</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                <label class="form-check-label" for="female">Female</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                <label class="form-check-label" for="other">Other</label>
              </div>
            </div>
            <div id="invalid-gender" class="text-danger small mt-1"></div>
          </div>

          <!-- Work Role -->
          <div class="mb-3">
            <div class="form-floating">
              <select class="form-select" id="roleSelect">
                <option value="">Select role</option>
                <option value="1">Developer</option>
                <option value="2">Manager</option>
                <option value="3">Student</option>
              </select>
              <label for="roleSelect">Work Role</label>
            </div>
            <div id="invalid-role" class="text-danger small mt-1"></div>
          </div>

          <!-- Address -->
          <div class="mb-4">
            <div class="form-floating">
              <textarea class="form-control" id="addressInput" placeholder="Address" style="height: 100px"></textarea>
              <label for="addressInput">Address</label>
            </div>
            <div id="invalid-address" class="text-danger small mt-1"></div>
          </div>
           <div id="alertBox"></div>
           <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="termsCheck">
    <label class="form-check-label" for="termsCheck">
        I agree to the
        <a href="#"  class="text-decoration-none text-reset">Terms & Conditions</p>
    </label>
</div>
          <button type="button" class="btn btn-teal w-100 shadow-sm" id="register">Register Now</button>

        </form>
      </div>
    </div>

    <p class="mt-4 text-muted small">
      Already have an account?
      <a href="./login.html" class="text-decoration-none fw-bold" style="color: var(--accent-teal);">Log in</a>
    </p>

  </div>

  <script src="../script/register.js"></script>
</body>
</html>
