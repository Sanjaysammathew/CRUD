<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Login</title>

 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../style/login.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="d-flex align-items-center vh-100 mt-4">

  <button class="btn btn-outline-secondary theme-toggle " id="themeToggler">
    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
  </button>

  <div class="container d-flex justify-content-center">
    <div class="auth-box text-center">

      <!-- LOGO & BRAND NAME -->
      <div class="brand-logo">
        <i class="bi bi-intersect"></i>
      </div>
      <div class="brand-title">TaskFlow</div>

      <!-- CARD -->
      <div class="card shadow-lg bg-body">
        <div class="card-body p-4 p-sm-5">
          <form id="loginForm">
            <div class="mb-3 text-start">
              <label class="form-label small fw-medium">Email Address</label>
              <input type="text" id="email" class="form-control" placeholder="name@example.com" required>
              <div class="invalid-email"></div> <!-- Empty for JS -->
            </div>

            <div class="mb-3 text-start">
              <label class="form-label small fw-medium">Password</label>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required>
              <div class="invalid-password"></div> <!-- Empty for JS -->
            </div>

            <button type="submit" class="btn btn-main w-100 mt-2">Login</button>
          </form>

          <div class="mt-4">
            <p class="small text-secondary">
              Don't have an account? 
              <a href="./Register.html" class="fw-bold text-decoration-none" style="color: var(--accent-teal);">Register here</a>
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="../script/login.js"></script>
</body>
</html>
