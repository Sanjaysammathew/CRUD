<!DOCTYPE html>
<html lang="en" >

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Todos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../style/style.css">

</head>

<body class="bg-black" >


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a href="#" class="navbar-brand fw-bold brand-title">
                TaskFlow
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item me-2">
        <button class="btn btn-link nav-link shadow-none" id="themeToggle" type="button">
            <span id="themeIcon">🌙</span>
        </button>
    </li>

                    <li class="nav-item">

                        <a href="./landing.html" class="nav-link">
                            Home
                        </a>

                    </li>

                    <li class="nav-item">

                        <a href="./login.html" class="nav-link">
                            Login
                        </a>

                    </li>

                    <li class="nav-item">

                        <a href="./Register.html" class="nav-link">
                            Sign in
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- HERO SECTION -->

    <section class="text-center mt-5">

        <div class="container">

            <h1 class="text-white fw-bold heading">
                TaskFlow
            </h1>

            <p class="fs-5 text-secondary mt-3">

                Organize your daily tasks,
                manage your work,
                and stay productive every day.

            </p>


            <button
                class="btn btn-danger px-4 fw-bold mt-3"
                data-bs-toggle="modal"
                data-bs-target="#taskModal"
            >

                Add Task

            </button>

        </div>

    </section>

<section class="container mt-4">

    <div class="d-flex flex-wrap gap-3 justify-content-center">

        <button 
            class="btn  btn-outline-success text-white px-4 py-2 rounded-pill"
            onclick="filterTasks('completed')"
        >
            Completed
        </button>

        <button 
            class="btn text-white btn-outline-warning px-4 py-2 rounded-pill"
            onclick="filterTasks('pending')"
        >
            Pending
        </button>

        <button 
            class="btn text-white btn-outline-danger px-4 py-2 rounded-pill"
            onclick="filterTasks('Not started')"
        >
            Not Started
        </button>

        <button 
            class="btn text-white btn-outline-primary px-4 py-2 rounded-pill"
            onclick="fetchTasks()"
        >
            All
        </button>

    </div>

</section>

    <!-- TASK SECTION -->

    <section class="mt-5 mb-5">

        <div class="container">

            <div
                class="row g-4 justify-content-center"
                id="taskContainer"
            >

            </div>

        </div>

    </section>



    <!-- ADD TASK MODAL -->

    <div class="modal fade" id="taskModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>



                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Add Task

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter your task"
                            id="taskInput"
                        >

                    </div>



                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Add Description

                        </label>

                        <textarea
                            class="form-control"
                            placeholder="Enter task details"
                            id="taskDescription"
                        ></textarea>

                    </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Due Date</label>
                    <input type="date" class="form-control w-50 " id="taskDate">
                </div>

                 <div class="mb-3">
                    <label class="form-label fw-bold">Status</label>
                    <select class="form-select" id="taskPriority">
                        <option selected disabled value="">Choose status...</option>
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                        <option value="Not started">Not Started</option>
                    </select>
                </div>
                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-danger"
                        onclick="addTask()"
                    >

                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- UPDATE TASK MODAL -->

    <div class="modal fade" id="taskModalUpdate">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Update Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>



                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Update Task

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="updateValue"
                        >

                    </div>



                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Update Description

                        </label>

                        <textarea
                            class="form-control"
                            id="updateDescription"
                        ></textarea>

                    </div>

                      <div class="mb-3">
                    <label class="form-label fw-bold"> Update Due Date</label>
                    <input type="date" class="form-control w-50 " id="UpdatetaskDate">
                </div>
                     
                <select class="form-select" id="updateStatus">

    <option selected disabled value="">
        Choose status...
    </option>

    <option value="completed">
        Completed
    </option>

    <option value="pending">
        Pending
    </option>

    <option value="Not started">
        Not Started
    </option>

</select>

                </div>

                 


                <div class="modal-footer">

                    <button class="btn btn-primary" id="update">

                        Update

                    </button>

                </div>

            </div>

        </div>

    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../script/script.js"></script>

</body>

</html>
