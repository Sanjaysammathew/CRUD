<!DOCTYPE html>
<html lang="en" >

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Todos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/style.css">

</head>

<body class="bg-black" >


    <!-- NAVBAR -->

     <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a href="#" class="navbar-brand fw-bold brand-title">
                TaskFlow
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item me-2">
        <button class="btn btn-link nav-link shadow-none" id="themeToggle" type="button">
            <span id="themeIcon">🌙</span>
        </button>
    </li>

                 <li class="nav-item">
                
                 </li>
                 
                  <li class="nav-item">
    <button class="nav-link text-muted d-flex align-items-center gap-2 btn btn-link border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#userProfileOffcanvas">
        <!-- SVG User Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-person-circle text-secondary" viewBox="0 0 16 16">
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
        </svg>
        <span id="navUsername">User</span>
    </button>
</li>
                </ul>

            </div>

        </div>

    </nav>



    <!-- HERO SECTION -->

    <section class="text-center mt-5">

        <div class="container">

            <h1 class=" fw-bold heading brand-title">
                TaskFlow
            </h1>

            <p class="fs-5 text-secondary mt-3">

                Organize your daily tasks,
                manage your work,
                and stay productive every day.

            </p>

<button class="btn btn-danger px-4 fw-bold mt-3 d-inline-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#taskModal">
    <i class="bi bi-plus-circle"></i> Add Task
</button>

            </button>

  <button class="btn btn-overdue-urgent text-white mt-3 ms-3 d-inline-flex align-items-center gap-2" onclick="fetchDeletedTasks()">
    <i class="bi bi-arrow-counterclockwise"></i> Restore Task
</button>
        </div>

    </section>

<section class="container mt-4">
    <div class="d-flex flex-wrap gap-3 justify-content-center">
        <button class="btn btn-outline-primary text-white px-4 py-2 rounded-pill filter-btn bg-primary"
                onclick="setActiveFilter(this, 'bg-primary'); fetchTasks()">
            All
        </button>

        <button class="btn btn-outline-success text-white px-4 py-2 rounded-pill filter-btn"
                onclick="setActiveFilter(this, 'bg-success'); filterTasks('completed')">
            Completed
        </button>

        <button class="btn btn-outline-warning text-white px-4 py-2 rounded-pill filter-btn"
                onclick="setActiveFilter(this, 'bg-warning'); filterTasks('pending')">
            Pending
        </button>

        <button class="btn btn-outline-danger text-white px-4 py-2 rounded-pill filter-btn"
                onclick="setActiveFilter(this, 'bg-danger'); filterTasks('Not started')">
            Not Started
        </button>

        <button class="btn btn-outline-danger text-white px-4 py-2 rounded-pill filter-btn"
                onclick="setActiveFilter(this, 'bg-danger'); fetchOverDueTasks()">
            Over Due
        </button>

<div class="dropdown">
    <button class="btn btn-filter-outline px-4 py-2 rounded-pill dropdown-toggle filter-btn" 
            type="button" 
            id="dateFilterDropdown" 
            data-bs-toggle="dropdown" 
            aria-expanded="false">
        <i class="bi bi-calendar-event me-1"></i> Filter by Date
    </button>
<ul class="dropdown-menu" aria-labelledby="dateFilterDropdown">
    <li><a class="dropdown-item" href="#" onclick="filterTasksByDate('today')">Today</a></li>
    <li><a class="dropdown-item" href="#" onclick="filterTasksByDate('yesterday')">Yesterday</a></li>
    <li><a class="dropdown-item" href="#" onclick="filterTasksByDate('thisweek')">This Week</a></li>
    <li><a class="dropdown-item" href="#" onclick="filterTasksByDate('old')">Older</a></li>
    <li><hr class="dropdown-divider"></li>
    <li><a class="dropdown-item" href="#" onclick="promptCustomDateRange()"><i class="bi bi-calendar-range me-1"></i> Custom Range...</a></li>
</ul>
</div>
    </div>
</section>

    <!-- TASK SECTION -->

    <section class="mt-5 mb-5">

        <div class="container">

            <div
                class="row g-4 justify-content-center"
                id="taskContainer"
            >

            </div>

        </div>

    </section>



    <!-- ADD TASK MODAL -->

    <div class="modal fade" id="taskModal">

        <div class="modal-dialog  modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>



                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                             <span class="text-danger">*</span>Task

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter your task"
                            id="taskInput"
                        >

                    </div>



                    <div class="mb-3">

                        <label class="form-label fw-bold">

                                   <span class="text-danger">*</span>Description

                        </label>

                        <textarea
                            class="form-control"
                            placeholder="Enter task details"
                            id="taskDescription"
                        ></textarea>

                    </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">       <span class="text-danger">*</span>Due Date</label>
                    <input type="date" class="form-control w-50 " id="taskDate">
                </div>

                 <div class="mb-3">
                    <label class="form-label fw-bold">       <span class="text-danger">*</span>Status</label>
                    <select class="form-select" id="taskPriority">
                        <option selected disabled value="">Choose status...</option>
                
                        <option value="pending">Pending</option>
                        <option value="Not started">Not Started</option>
                    </select>
                </div>
                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-danger"
                        onclick="addTask()"
                    >

                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- UPDATE TASK MODAL -->

    <div class="modal fade" id="taskModalUpdate">

        <div class="modal-dialog  modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Update Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>



                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                                   <span class="text-danger">*</span>Task

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="updateValue"
                        >

                    </div>



                    <div class="mb-3">

                        <label class="form-label fw-bold">

                                   <span class="text-danger">*</span>Description

                        </label>

                        <textarea
                            class="form-control"
                            id="updateDescription"
                        ></textarea>

                    </div>

                      <div class="mb-3">
                    <label class="form-label fw-bold">        <span class="text-danger">*</span>Due date</label>
                    <input type="date" class="form-control w-50 " id="UpdatetaskDate">
                </div>
                     
                   <div class="mb-3">
                    <label class="form-label fw-bold">    <span class="text-danger">*</span>Status</label>
                    <select class="form-select" id="updateStatus">
                        <option selected disabled value="">Choose status...</option>
                
                        <option value="pending">Pending</option>
                         <option value="completed">Completed</option>
                        <option value="Not started">Not Started</option>
                    </select>
                </div>

                </div>

                 


                <div class="modal-footer">

                    <button class="btn btn-primary" id="update">

                        Update

                    </button>

                </div>

            </div>

        </div>

    </div>


<!-- OFFCANVAS SIDEBAR -->
<!-- OFFCANVAS SIDEBAR -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="userProfileOffcanvas">

    <!-- HEADER -->
    <div class="offcanvas-header border-bottom">

        <h5 class="offcanvas-title fw-bold">
            User Profile
        </h5>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
        ></button>

    </div>

    <!-- BODY -->
    <div class="offcanvas-body d-flex flex-column justify-content-between">

        <div>

            <!-- PROFILE IMAGE -->
            <div class="text-center mb-4">

                <div
                    class="bg-secondary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                    style="width:90px; height:90px;"
                >

                    <span class="fs-1 text-white">
                        👤
                    </span>

                </div>

                <h4 class="fw-bold">
                    <span id="dropdownUsername">
                        User
                    </span>
                </h4>

                <p class="fw-bold">welcome to taskflow</p>

              <div class="mt-4">

            <button
                class="btn btn-danger w-50 py-2 fw-bold"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>


            </div>

            <!-- USER DETAILS CARD -->
            <div class="card shadow-sm border-0 p-3">

                <div class="mb-3">
                    <small class="text-muted">
                        Username
                    </small>

                    <h6 id="profileUsername" class="fw-bold">
                        -
                    </h6>
                </div>

                <div class="mb-3">
                    <small class="text-muted">
                        Email
                    </small>

                    <h6 id="profileEmail" class="fw-bold">
                        -
                    </h6>
                </div>

                <div class="mb-3">
                    <small class="text-muted">
                        Phone
                    </small>

                    <h6 id="profilePhone" class="fw-bold">
                        -
                    </h6>
                </div>

                <div class="mb-3">
                    <small class="text-muted">
                        Date of Birth
                    </small>

                    <h6 id="profileDob" class="fw-bold">
                        -
                    </h6>
                </div>

                <div class="mb-3">
                    <small class="text-muted">
                        Gender
                    </small>

                    <h6 id="profileGender"
                        class="fw-bold text-capitalize">
                        -
                    </h6>
                </div>

                <div class="mb-3">
                    <small class="text-muted">
                        Address
                    </small>

                    <h6 id="profileAddress" class="fw-bold">
                        -
                    </h6>
                </div>

            </div>

        </div>

        <!-- LOGOUT BUTTON -->
   
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../script/script.js"></script>

</body>

</html>
